name: Astro CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type and template checks
        run: npm run check
      - name: Regenerate legacy redirects
        run: npm run legacy:redirects
      - name: Verify generated redirects are committed
        run: git diff --exit-code -- public/services
      - name: Build static site
        run: npm run build
      - name: Run static output smoke tests
        run: npm test
