name: Astro CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # full history so sitemap lastmod dates match real commits
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type and template checks
        run: npm run check
      - name: Regenerate legacy redirects
        run: npm run legacy:redirects
      - name: Verify generated redirects are committed
        run: git diff --exit-code -- public/services
      - name: Build static site
        run: npm run build
      - name: Run static output smoke tests
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface failing assertions in the checks UI: the raw job log is not
            # always readable from automation, annotations are.
            grep -nE "^(not ok|# fail)|AssertionError|expected:|actual:|operator:" test-output.log \
              | head -8 | sed 's/%/%25/g; s/\r//g' \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
      - name: Run SEO audit
        run: npm run seo:audit
