<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="1;url=../fa/services/customs-port/">
  <title>customs-port | انتقال صفحه</title>
  <script>
    const target = "../fa/services/customs-port/";
    const aliases = {"fleet-specs":["urban-vip","fleet-specs"],"personnel-food":["personnel-food","personnel-food"],"food-menu":["personnel-food","food-menu"],"food-gallery":["personnel-food","food-gallery"],"food-request":["personnel-food","food-request"],"food-faq":["personnel-food","food-faq"]};
    let fragment = '';
    try { fragment = decodeURIComponent(location.hash.slice(1)); } catch {}
    const alias = aliases[fragment];
    const destination = alias
      ? new URL('../fa/services/' + alias[0] + '/#' + alias[1], location.href)
      : new URL(target + (fragment ? '#' + encodeURIComponent(fragment) : ''), location.href);
    location.replace(destination.href);
  </script>
</head>
<body>
  <p>این صفحه به نشانی جدید منتقل شده است.</p>
  <p><a href="../fa/services/customs-port/">ادامه به customs-port</a></p>
</body>
</html>
